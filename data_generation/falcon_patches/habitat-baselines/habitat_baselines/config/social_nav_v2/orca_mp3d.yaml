habitat_baselines:
  evaluate: True          # run eval instead of train
  num_updates: 0         # no training loop
  total_num_steps: -1      # also disable the steps cap so only eval runs
  num_checkpoints: 0      # don't save ckpt.0.pth
  checkpoint_folder: ""   # optional: disable the path entirely
  verbose: False
  trainer_name: "orca-notrainer"
  torch_gpu_id: 0
  tensorboard_dir: "evaluation/orca/mp3d/tb"
  video_dir: "evaluation/orca/mp3d/video"
  test_episode_count: 1 # -1
  eval_ckpt_path_dir: "evaluation/orca/mp3d/checkpoints"
  num_environments: 1 # 4
  # checkpoint_folder: "evaluation/orca/mp3d/checkpoints"
  # num_updates: -1
  # total_num_steps: 1e8
  log_interval: 10
  # num_checkpoints: 200
  # Force PyTorch to be single threaded as
  # this improves performance considerably
  force_torch_single_threaded: True
  load_resume_state_config: False

  evaluator:
    _target_: habitat_baselines.rl.ppo.orca_evaluator.ORCAEvaluator

  eval:
    use_ckpt_config: False
    should_load_ckpt: False
    video_option: ["disk"]                # save to disk

  rl:
    agent:
      type: "MultiAgentAccessMgr"
      num_agent_types: 201  # 1 robot + 200 humans

