  dataset:
    # scenes_dir: data/scene_datasets/mp3d/v1/tasks/mp3d_habitat
    data_path: data/datasets/pointnav/crowd-mp3d/{split}/{split}.json.gz
  environment:
    iterator_options:
      shuffle: False # keep the same order
  gym:
    obs_keys:
      - agent_0_articulated_agent_jaw_depth
      - agent_0_pointgoal_with_gps_compass
      - agent_0_localization_sensor
      - agent_1_localization_sensor
      - agent_2_localization_sensor
      - agent_3_localization_sensor
