      - agent_6_localization_sensor
      - agent_0_oracle_shortest_path_sensor
      - agent_0_human_velocity_sensor
  task:
    actions:
      agent_0_discrete_stop:
        lin_speed: 0.0
        ang_speed: 0.0
      agent_0_discrete_move_forward:
        lin_speed: 25.0
        ang_speed: 0.0
        allow_dyn_slide: True
      agent_0_discrete_turn_left:
        lin_speed: 0.0
        ang_speed: 20.0
        allow_dyn_slide: True
      agent_0_discrete_turn_right:
        lin_speed: 0.0
        ang_speed: -20.0
        allow_dyn_slide: True
      agent_0_discrete_move_backward:
        lin_speed: 25.0    # match your forward speed
        ang_speed: 0.0
        allow_dyn_slide: True
      agent_0_discrete_pause:
        lin_speed: 0.0
        ang_speed: 0.0
        allow_dyn_slide: True

